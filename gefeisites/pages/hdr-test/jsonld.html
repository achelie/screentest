<script type="application/ld+json">[{"@context": "https://schema.org", "@graph": [{"@type": "WebApplication", "@id": "https://screentesthub.com/hdr-test#application", "name": "ScreenTestHub HDR Test Online", "description": "Run an HDR test online to check the browser's reported dynamic range, inspect shadow and highlight detail, and compare sRGB with wide-gamut colors.", "url": "https://screentesthub.com/hdr-test", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any", "browserRequirements": "A modern browser with JavaScript. Fullscreen is optional.", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}}, {"@type": "BreadcrumbList", "@id": "https://screentesthub.com/hdr-test#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://screentesthub.com/"}, {"@type": "ListItem", "position": 2, "name": "HDR Test Online", "item": "https://screentesthub.com/hdr-test"}]}, {"@type": "FAQPage", "@id": "https://screentesthub.com/hdr-test#faq", "mainEntity": [{"@type": "Question", "name": "Why does the test report SDR when my monitor supports HDR?", "acceptedAnswer": {"@type": "Answer", "text": "The browser sees the complete output path, not the monitor label alone. Enable HDR in the operating system, move the browser window to the HDR display, check the cable and GPU output, then reload. A capable display can still be reported as SDR when HDR is disabled or the browser cannot expose the signal."}}, {"@type": "Question", "name": "Why does the Windows desktop look gray after HDR is enabled?", "acceptedAnswer": {"@type": "Answer", "text": "Most desktop pages are SDR and Windows must tone-map them inside an HDR output. That conversion can make SDR white, contrast, or color look different. Adjust the Windows SDR content brightness control and compare with HDR video or a game before judging the display."}}, {"@type": "Question", "name": "Can a website measure my monitor's peak brightness in nits?", "acceptedAnswer": {"@type": "Answer", "text": "No. A webpage cannot turn what your eyes see into an accurate luminance measurement. Peak brightness, black level, contrast, and VESA DisplayHDR performance require a meter and controlled patterns. This tool only reports browser capability signals and shows visual checks."}}, {"@type": "Question", "name": "Can this HDR test identify HDR10, HDR10+, or Dolby Vision?", "acceptedAnswer": {"@type": "Answer", "text": "No. The browser media query reports a high dynamic range environment, not the negotiated video format or display certification. HDR10, HDR10+, Dolby Vision, and HLG depend on the media, application, operating system, connection, and hardware chain."}}, {"@type": "Question", "name": "Does a 24-bit browser color buffer mean my panel is not 10-bit?", "acceptedAnswer": {"@type": "Answer", "text": "No. The browser value commonly describes its RGB color buffer as 8 bits per channel, or 24 bits total. It does not reveal whether the physical panel is native 10-bit, 8-bit plus FRC, or how the GPU sends the final signal."}}, {"@type": "Question", "name": "What should I look for on OLED and Mini LED displays?", "acceptedAnswer": {"@type": "Answer", "text": "On OLED, compare near-black separation and watch whether a large white area dims because of automatic brightness limiting. On Mini LED, inspect the small bright window for halos and check whether shadow detail changes when local dimming settings change."}}, {"@type": "Question", "name": "Why do the sRGB and Display P3 color blocks look the same?", "acceptedAnswer": {"@type": "Answer", "text": "The display may be limited to sRGB, wide color may be disabled, or the browser and color profile may map both samples into a similar visible result. A visible difference is useful evidence, but no difference is not proof of a narrow-gamut panel."}}]}]}]</script>
