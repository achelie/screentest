stimated output pixels?", "acceptedAnswer": {"@type": "Answer", "text": "CSS pixels size browser interfaces and web layouts. Estimated output pixels multiply that reported size by DPR to approximate the device-pixel output currently used for the page."}}, {"@type": "Question", "name": "Why is my device pixel ratio 1.25 or 1.5?", "acceptedAnswer": {"@type": "Answer", "text": "Fractional values are common when desktop scaling is set to 125% or 150%. Browser zoom can also affect DPR, so use 100% page zoom when you want the cleanest comparison."}}, {"@type": "Question", "name": "Why does the result change when I move the window?", "acceptedAnswer": {"@type": "Answer", "text": "Each monitor can use a different resolution and scaling value. The checker updates after the browser moves to a display with a different screen size or DPR."}}, {"@type": "Question", "name": "Why is the browser viewport smaller than the screen?", "acceptedAnswer": {"@type": "Answer", "text": "Tabs, the address bar, window borders, taskbars, mobile browser controls, and on-screen keyboards can all reduce the page area. Fullscreen removes most browser chrome so you can compare again."}}, {"@type": "Question", "name": "Why does browser frame cadence differ from my monitor's refresh rate?", "acceptedAnswer": {"@type": "Answer", "text": "The estimate measures animation callbacks delivered to this page. Browser workload, background throttling, power saving, compositing, and frame pacing can make it differ from the refresh rate selected for the monitor."}}, {"@type": "Question", "name": "Can I check an external monitor with this page?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Move the entire browser window onto that monitor, wait for the values to update, and enter fullscreen there. This page checks the display holding the window and does not request access to every connected screen."}}]}]}]</script>
