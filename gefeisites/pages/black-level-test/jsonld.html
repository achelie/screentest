<script type="application/ld+json">[{"@context": "https://schema.org", "@graph": [{"@type": "WebApplication", "@id": "https://screentesthub.com/black-level-test#application", "name": "ScreenTestHub Black Level Test Online", "description": "Run a fullscreen black level test with pure black, RGB 1-10 near-black steps, a dark ramp, and embedded shadow patterns to check black crush and shadow detail.", "url": "https://screentesthub.com/black-level-test", "inLanguage": "en", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any", "browserRequirements": "A modern browser with JavaScript. Fullscreen is optional.", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}}, {"@type": "BreadcrumbList", "@id": "https://screentesthub.com/black-level-test#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://screentesthub.com/"}, {"@type": "ListItem", "position": 2, "name": "Screen tests", "item": "https://screentesthub.com/tests"}, {"@type": "ListItem", "position": 3, "name": "Black Level Test", "item": "https://screentesthub.com/black-level-test"}]}, {"@type": "FAQPage", "@id": "https://screentesthub.com/black-level-test#faq", "inLanguage": "en", "mainEntity": [{"@type": "Question", "name": "How many near-black blocks should I be able to see?", "acceptedAnswer": {"@type": "Answer", "text": "There is no universal pass number for every monitor, room, and viewing mode. Count the blocks you can see consistently, change one setting, and compare again. The pattern is useful for relative adjustment, not a panel grade."}}, {"@type": "Question", "name": "What is black crush?", "acceptedAnswer": {"@type": "Answer", "text": "Black crush happens when different dark input values are rendered as the same black output. Hair, fabric, game shadows, and dark movie scenes then lose detail even though the source still contains it."}}, {"@type": "Question", "name": "Should HDR be off for this test?", "acceptedAnswer": {"@type": "Answer", "text": "Yes for a controlled SDR pass. HDR tone mapping can redistribute near-black values and make results vary by operating system, browser, and display mode. Test HDR separately with HDR content and the HDR tool."}}, {"@type": "Question", "name": "Can RGB Full and Limited change the result?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. A mismatch between 0-255 Full range and 16-235 Limited range can lift black or clip shadows. Check that the graphics output, monitor, television, receiver, and console use compatible range settings."}}, {"@type": "Question", "name": "Should I change brightness or contrast first?", "acceptedAnswer": {"@type": "Answer", "text": "Start from the display preset and black-level or brightness guidance for your model. On many desktop monitors, the brightness control mainly changes backlight output rather than the digital black point. Change one control at a time and keep notes."}}, {"@type": "Question", "name": "Is this the same as a backlight bleed test?", "acceptedAnswer": {"@type": "Answer", "text": "No. Both use black, but the Backlight Bleed Test focuses on fixed bright edges, cloudy corners, and IPS glow. This tool adds precise near-black steps and embedded shadow patterns to check tonal separation."}}, {"@type": "Question", "name": "Can this page measure my monitor's black luminance or contrast ratio?", "acceptedAnswer": {"@type": "Answer", "text": "No. A browser can send RGB values, but it cannot measure the light leaving the panel. Black luminance, native contrast, and calibration accuracy require a meter and controlled conditions."}}]}]}]</script>
