<script type="application/ld+json">[{"@context": "https://schema.org", "@graph": [{"@type": "WebApplication", "@id": "https://screentesthub.com/tests/grayscale#application", "name": "Screen Uniformity Test", "inLanguage": "en", "description": "Run a gray screen test at 5%, 10%, 25%, 50%, 75%, and 100% to check screen uniformity, OLED tint, and dirty screen effect online.", "url": "https://screentesthub.com/tests/grayscale", "applicationCategory": "UtilitiesApplication", "operatingSystem": "Any", "browserRequirements": "A modern browser with JavaScript. Fullscreen support is optional.", "isAccessibleForFree": true, "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}}, {"@type": "BreadcrumbList", "@id": "https://screentesthub.com/tests/grayscale#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://screentesthub.com/"}, {"@type": "ListItem", "position": 2, "name": "Screen tests", "item": "https://screentesthub.com/tests"}, {"@type": "ListItem", "position": 3, "name": "Screen Uniformity Test", "item": "https://screentesthub.com/tests/grayscale"}]}, {"@type": "FAQPage", "@id": "https://screentesthub.com/tests/grayscale#faq", "inLanguage": "en", "mainEntity": [{"@type": "Question", "name": "What is dirty screen effect on a monitor or TV?", "acceptedAnswer": {"@type": "Answer", "text": "Dirty screen effect is visible brightness or color variation across what should be an even field. It often looks like cloudy patches, vertical bands, or faint stains during camera pans, sports, and other flat scenes. Gray patterns make the variation easier to spot."}}, {"@type": "Question", "name": "Is uneven 5% gray normal on an OLED screen?", "acceptedAnswer": {"@type": "Answer", "text": "Some near-black variation is common, especially on a new panel or at very low brightness. Judge it from your normal seat after warm-up and check whether it appears in real dark content. Severe bands, tint, or blotches that remain distracting may justify contacting the seller."}}, {"@type": "Question", "name": "Should I run a pixel refresh before this OLED uniformity test?", "acceptedAnswer": {"@type": "Answer", "text": "Let the display complete its normal automatic maintenance first. Do not repeatedly run a manual panel refresh just to chase a test pattern because intensive refresh cycles can add wear. Follow the manufacturer's instructions if a real-content problem remains after normal use."}}, {"@type": "Question", "name": "Why does gray uniformity change when I move my head?", "acceptedAnswer": {"@type": "Answer", "text": "LCD viewing angles can shift brightness and tint across the screen, particularly on large panels viewed from close range. Test from the center at your normal distance. If the patch moves or changes as you move, viewing angle is contributing to what you see."}}, {"@type": "Question", "name": "Can a camera accurately capture dirty screen effect?", "acceptedAnswer": {"@type": "Answer", "text": "A photo can help document the location, but automatic exposure, lens shading, moire, and compression can add patterns that your eyes do not see. Use a locked exposure and compare the photo with the screen in person. Real content from your normal seat matters most."}}]}]}]</script>
